# Cloudflare deployment config for the Sealion 7 trip dashboard (PWA).
# This is a static-asset-only Worker: no server code, it just serves the
# files in ./docs/pwa. `npx wrangler deploy` (the dashboard's default deploy
# command) reads this file and uploads that directory.
#
# docs/pwa is also mirrored byte-for-byte into app/src/main/assets/pwa so the
# native app can serve the same dashboard locally over its embedded HTTP
# server — keep both copies in sync when editing either one.

name = "sealion7-trip-stats"
compatibility_date = "2026-06-01"

[assets]
directory = "./docs/pwa"
# Deliberately plain 404s for unmatched paths (the default) — NOT
# "single-page-application" fallback. The app's own routing is entirely
# hash-based (#trip/1), never sent to the server, so there are no client
# routes to fall back for. More importantly, on load the app probes
# GET /api/status to detect whether it's being served by the car's embedded
# HTTP server (live mode) vs. loaded standalone (upload-a-.db-file mode).
# SPA fallback would answer that probe (and every other /api/* call) with
# index.html + 200 OK instead of a real 404, so the app wrongly detects live
# mode and then fails to parse HTML as JSON.
